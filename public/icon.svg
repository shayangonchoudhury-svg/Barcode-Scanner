<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0" />
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="1" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Inner Soft Glow Container -->
  <rect x="56" y="56" width="400" height="400" rx="64" fill="#121215" stroke="#22222a" stroke-width="2" />

  <!-- Viewfinder Reticle Corners -->
  <!-- Top Left -->
  <path d="M 120 180 L 120 140 A 20 20 0 0 1 140 120 L 180 120" fill="none" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round" />
  <!-- Top Right -->
  <path d="M 332 120 L 372 120 A 20 20 0 0 1 392 140 L 392 180" fill="none" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round" />
  <!-- Bottom Left -->
  <path d="M 120 332 L 120 372 A 20 20 0 0 0 140 392 L 180 392" fill="none" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round" />
  <!-- Bottom Right -->
  <path d="M 332 392 L 372 392 A 20 20 0 0 0 392 372 L 392 332" fill="none" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Central Barcode Lines -->
  <g transform="translate(156, 176)">
    <rect x="0" y="0" width="12" height="160" rx="6" fill="#f4f4f5" />
    <rect x="22" y="0" width="6" height="160" rx="3" fill="#a1a1aa" />
    <rect x="38" y="0" width="18" height="160" rx="6" fill="#f4f4f5" />
    <rect x="66" y="0" width="8" height="160" rx="4" fill="#a1a1aa" />
    <rect x="84" y="0" width="14" height="160" rx="6" fill="#f4f4f5" />
    <rect x="108" y="0" width="6" height="160" rx="3" fill="#a1a1aa" />
    <rect x="124" y="0" width="22" height="160" rx="6" fill="#f4f4f5" />
    <rect x="156" y="0" width="10" height="160" rx="5" fill="#a1a1aa" />
    <rect x="176" y="0" width="16" height="160" rx="6" fill="#f4f4f5" />
    <rect x="200" y="0" width="8" height="160" rx="4" fill="#a1a1aa" />
  </g>

  <!-- Laser Scan Beam with Glow -->
  <g filter="url(#glow)">
    <line x1="100" y1="256" x2="412" y2="256" stroke="url(#laserGrad)" stroke-width="6" stroke-linecap="round" />
    <circle cx="256" cy="256" r="5" fill="#6ee7b7" />
  </g>

  <!-- Verification Shield Mini Badge (Bottom Right Accent) -->
  <circle cx="380" cy="380" r="38" fill="#09090b" stroke="#34d399" stroke-width="4" />
  <path d="M 368 380 L 376 388 L 394 370" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
