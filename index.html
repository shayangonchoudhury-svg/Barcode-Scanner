<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Barcode Scanner – Food & Product Intelligence</title>
    <meta
      name="description"
      content="Instant mobile barcode scanner with Open Food Facts database, allergen cross-checking, Google Search Grounding fallback, and offline scan history."
    />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Barcode Scanner" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- OpenGraph & Twitter Social Card Meta -->
    <meta property="og:title" content="Barcode Scanner – Food & Product Intelligence" />
    <meta
      property="og:description"
      content="Instant mobile barcode scanner with Open Food Facts database, allergen cross-checking, Google Search Grounding fallback, and offline scan history."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Barcode Scanner" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Barcode Scanner – Food & Product Intelligence" />
    <meta
      name="twitter:description"
      content="Instant mobile barcode scanner with Open Food Facts database, allergen cross-checking, Google Search Grounding fallback, and offline scan history."
    />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- Typography Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- html5-qrcode CDN fallback for iOS/Safari & browsers without native BarcodeDetector -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/service-worker.js')
            .then((reg) => {
              console.log('[PWA] Service Worker registered with scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 min-h-screen overflow-x-hidden antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
